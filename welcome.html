<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | Truck Dispatch Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Welcome Card */
        .welcome-card {
            background: white;
            border-radius: 30px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Icon */
        .icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 25px;
        }

        .icon i {
            font-size: 3rem;
            color: white;
        }

        /* Text */
        h1 {
            font-size: 2rem;
            color: #1a1a2e;
            margin-bottom: 10px;
        }

        .driver-name {
            font-size: 1.5rem;
            color: #e94560;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .message {
            color: #6c757d;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: space-around;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .stat-box {
            flex: 1;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }

        .stat-box i {
            font-size: 1.5rem;
            color: #e94560;
            margin-bottom: 8px;
        }

        .stat-box .number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a1a2e;
        }

        .stat-box .label {
            font-size: 0.7rem;
            color: #6c757d;
        }

        /* Buttons */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #e94560, #0f3460);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233,69,96,0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #e94560;
            color: #e94560;
        }

        .btn-outline:hover {
            background: #e94560;
            color: white;
        }

        /* Quote */
        .quote {
            margin-top: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 15px;
            font-size: 0.85rem;
            color: #1a1a2e;
            font-style: italic;
        }

        .quote i {
            color: #e94560;
            margin-right: 8px;
        }

        /* Responsive */
        @media (max-width: 500px) {
            .welcome-card {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .driver-name {
                font-size: 1.2rem;
            }
            
            .stats {
                flex-direction: column;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            .btn {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <div class="icon">
            <i class="fas fa-hand-peace"></i>
        </div>
        
        <h1>Welcome Back!</h1>
        <div class="driver-name" id="driverName">Driver</div>
        
        <p class="message">
            Your dispatch team is ready 24/7. Let's get you on the road to higher earnings!
        </p>
        
        <div class="stats">
            <div class="stat-box">
                <i class="fas fa-truck"></i>
                <div class="number" id="activeLoads">0</div>
                <div class="label">Active Loads</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-dollar-sign"></i>
                <div class="number" id="weeklyEarnings">$0</div>
                <div class="label">This Week</div>
            </div>
            <div class="stat-box">
                <i class="fas fa-star"></i>
                <div class="number" id="rating">0</div>
                <div class="label">Rating</div>
            </div>
        </div>
        
        <div class="btn-group">
            <a href="dashboard.html" class="btn btn-primary">
                <i class="fas fa-chalkboard-user"></i> Go to Dashboard
            </a>
            <a href="index.html" class="btn btn-outline">
                <i class="fas fa-home"></i> Home Page
            </a>
        </div>
        
        <div class="quote">
            <i class="fas fa-quote-left"></i>
            <span id="dailyQuote">Loading quote...</span>
        </div>
    </div>

    <script>
        // ==================== LOAD USER DATA ====================
        function loadUserData() {
            // Try to get user from localStorage
            let userData = localStorage.getItem('loggedInUser');
            
            // If no user found, create demo user
            if (!userData) {
                const demoUser = {
                    name: "Mike Johnson",
                    activeLoads: 2,
                    weeklyEarnings: 3250,
                    rating: 4.9
                };
                localStorage.setItem('loggedInUser', JSON.stringify(demoUser));
                userData = JSON.stringify(demoUser);
            }
            
            const user = JSON.parse(userData);
            
            // Update name
            const nameElem = document.getElementById('driverName');
            if (nameElem) {
                nameElem.textContent = user.name || "Driver";
            }
            
            // Update active loads
            const loadsElem = document.getElementById('activeLoads');
            if (loadsElem) {
                loadsElem.textContent = user.activeLoads || 0;
            }
            
            // Update weekly earnings
            const earningsElem = document.getElementById('weeklyEarnings');
            if (earningsElem) {
                earningsElem.textContent = `$${user.weeklyEarnings || 0}`;
            }
            
            // Update rating
            const ratingElem = document.getElementById('rating');
            if (ratingElem) {
                ratingElem.textContent = user.rating || 0;
            }
        }
        
        // ==================== DAILY QUOTES ====================
        const quotes = [
            "The road to success is always under construction. Keep rolling! 🚛",
            "Every mile counts. Make it profitable! 💰",
            "Your dispatch team is working 24/7 for you! 🌙",
            "Safety first, loads second, money follows! ⭐",
            "Another day, another dollar. Let's get it! 💪",
            "Keep the wheels turning and the cash flowing! 🔥",
            "You drive, we dispatch. Perfect team! 🤝",
            "Success doesn't come from what you do occasionally, but from what you do consistently. 🎯",
            "The best time to plant a tree was 20 years ago. The second best time is now. 🌳"
        ];
        
        function setDailyQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const quoteElem = document.getElementById('dailyQuote');
            if (quoteElem) {
                quoteElem.textContent = quotes[randomIndex];
            }
        }
        
        // ==================== INITIALIZE ====================
        loadUserData();
        setDailyQuote();
        
        // Optional: Add animation to stats
        const statBoxes = document.querySelectorAll('.stat-box');
        statBoxes.forEach((box, index) => {
            box.style.animation = `fadeIn 0.5s ease ${index * 0.1}s both`;
        });
    </script>
</body>
</html>
